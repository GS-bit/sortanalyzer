[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sortanalyzer"
version = "1.0.0"
description = "A software tool to analyze performance of sorting algorithms."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=15.0.0",
    "questionary>=2.1.1",
]

[project.scripts]
sortanalyzer = "sortanalyzer.main:main"

[tool.setuptools.packages.find]
where = ["src"]